[project]
name = "ball-balancing-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robin L'hyver", email = "robin.lhyver@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "adafruit-blinka>=9.2.0",
    "adafruit-circuitpython-busdevice>=5.2.17",
    "adafruit-circuitpython-pca9685>=3.4.22",
    "adafruit-platformdetect>=3.89.1",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "rpi-gpio>=0.7.1",
]

[project.scripts]
ball-balancing-robot = "ball_balancing_robot:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
