[project]
name = "ball-balancing-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Robin L'hyver", email = "robin.lhyver@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Real Raspberry Pi hardware access - needs native GPIO/I2C, only
    # installable (and only meaningful) on the Pi itself. Marked Linux-only
    # so `uv run` on a Windows/macOS dev machine doesn't try to compile
    # rpi-gpio's C extension - dev-side tools (sim, geometry_explorer) never
    # import these.
    "adafruit-blinka>=9.2.0; sys_platform == 'linux'",
    "adafruit-circuitpython-busdevice>=5.2.17; sys_platform == 'linux'",
    "adafruit-circuitpython-pca9685>=3.4.22; sys_platform == 'linux'",
    "adafruit-platformdetect>=3.89.1; sys_platform == 'linux'",
    "rpi-gpio>=0.7.1; sys_platform == 'linux'",
    "matplotlib>=3.9.0",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
]

[tool.uv]
package = false
